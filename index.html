    <script>
      // Désactiver le WebSocket Vite HMR pour éviter l'erreur "WebSocket closed without opened" sur Cloud Run
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function MockViteWebSocket(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') >= 0)) {
              isViteHmr = true;
            }
            if (typeof url === 'string' && (url.indexOf('vite') >= 0 || isViteHmr)) {
              var target = new EventTarget();
              target.url = url;
              target.readyState = 1; // WebSocket.OPEN
              target.protocol = 'vite-hmr';
              target.extensions = '';
              target.bufferedAmount = 0;
              target.binaryType = 'blob';
              target.send = function() {};
              target.close = function() {
                target.readyState = 3; // WebSocket.CLOSED
              };
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (e) {}
              }, 10);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          window.WebSocket = MockViteWebSocket;
        }

        // Suppress Vite HMR WebSocket errors
        var NEEDLES = ['websocket', 'closed without opened', '[vite]'];
        function matchesAny(value) {
          if (!value) return false;
          var s = '';
          if (typeof value === 'string') s = value;
          else if (value && value.message) s = String(value.message);
          else if (value && value.stack) s = String(value.stack);
          else s = String(value);
          s = s.toLowerCase();
          return NEEDLES.some(function(n) { return s.indexOf(n.toLowerCase()) >= 0; });
        }
        ['error', 'warn', 'log'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            var args = Array.prototype.slice.call(arguments);
            if (args.some(matchesAny)) return;
            orig.apply(console, args);
          };
        });

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (matchesAny(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || {};
          var msg = (reason && (reason.message || String(reason))) || '';
          if (matchesAny(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
